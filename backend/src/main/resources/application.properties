spring.application.name=racemanager-api
server.port=8080

# MySQL — ajustar usuario/clave según el entorno local
spring.datasource.url=jdbc:mysql://localhost:3306/racemanager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: el esquema canónico vive en database/schema.sql
# none mientras no existan entidades; pasar a validate al mapear el modelo
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false
