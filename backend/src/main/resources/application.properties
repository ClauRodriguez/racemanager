spring.application.name=racemanager-api
server.port=8080

# -----------------------------------------------------------------------------
# MySQL — valores tomados de variables de entorno (ver backend/.env.example).
# Nunca escribir contraseñas reales en este archivo.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/racemanager?serverTimezone=UTC}
spring.datasource.username=${DB_USER:racemanager}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: el esquema canónico vive en database/schema.sql (Hibernate no crea tablas).
# Pasar a "validate" cuando todas las entidades estén mapeadas y probadas contra MySQL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false

# -----------------------------------------------------------------------------
# Seguridad — JWT
# JWT_SECRET es obligatorio: mínimo 32 caracteres, distinto en cada entorno.
# La aplicación no arranca si falta o es demasiado corto.
# -----------------------------------------------------------------------------
racemanager.jwt.secret=${JWT_SECRET:}
racemanager.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}
racemanager.jwt.emisor=racemanager-api

# Orígenes permitidos para CORS (en desarrollo el proxy de Vite evita necesitarlo)
racemanager.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:5173}

# Límite de tamaño de archivos cargados (importador de resultados).
# No reemplaza la validación de formato y contenido del importador.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# No exponer detalles internos en respuestas de error
server.error.include-message=never
server.error.include-stacktrace=never
